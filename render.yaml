services:
  - type: web
    name: taskstack-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
