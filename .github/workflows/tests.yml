name: Tests

# Runs the whole test suite (server, desktop helpers, mobile client, packaging)
# on every pull request and every push to main. The desktop and Android build
# workflows only package the app; before this they were the only checks.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      # PyQt6 is imported by app_paths.py and config.py; no display is needed.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-server.txt
      - name: Run all tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
